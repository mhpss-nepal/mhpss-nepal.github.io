name: learning-release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_name:
        description: Reviewed repository package name (no path or URL)
        required: true
        type: string
      package_sha256:
        description: Exact SHA-256 of reviewed ZIP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: learning-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; verified upstream tag
        with:
          persist-credentials: false
      - name: Release acceptance and private roleplay
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -m unittest discover -s tests/learning-release -v
      - name: Existing website guard scope
        run: |
          python3 tools/i18n-check.py
          python3 tools/text-setting-check.py

  prepare-reviewed-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: learning-release-authorization
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: One operation - signed import, checks, deterministic candidate and scoped PR patch
        env:
          TMPDIR: ${{ runner.temp }}
          LEARNING_PACKAGE: ${{ inputs.package_name }}
          LEARNING_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          LEARNING_REGISTRY_SHA256: ${{ vars.LEARNING_REGISTRY_SHA256 }}
          LEARNING_READBACK_BASE_URL: ${{ vars.LEARNING_READBACK_BASE_URL }}
        run: python3 tools/learning-release/dispatch.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; verified upstream tag
        with:
          name: signed-learning-release-candidate
          path: ${{ runner.temp }}/learning-release-output/
          if-no-files-found: error
          retention-days: 7

# No pull_request_target, pages:write, id-token:write, direct main push,
# or deploy action. Existing legacy Pages hosting remains unchanged.
# Broker/auto-merge and production readback need separate institutional commissioning.
